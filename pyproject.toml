[project]
name = "viewgap"
version = "0.1.0"
description = "How much does the usual held-out-view test overstate novel view synthesis? A controlled 3D reconstruction study with ground-truth geometry."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "scipy>=1.11",
  "torch>=2.2",
  "opencv-python-headless>=4.9",
  "matplotlib>=3.8",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
viewgap = "viewgap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viewgap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CPU-only PyTorch: everything here is sized to run on a laptop without a GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
